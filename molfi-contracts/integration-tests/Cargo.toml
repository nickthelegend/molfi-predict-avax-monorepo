[package]
name = "molfi-integration-tests"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[lib]
crate-type = ["lib"]

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
molfi-verifier = { path = "../contracts/verifier" }
molfi-market = { path = "../contracts/market" }
molfi-clob-settlement = { path = "../contracts/clob-settlement" }
molfi-privacy-pool = { path = "../contracts/privacy-pool" }
molfi-policy = { path = "../contracts/policy" }
ed25519-dalek = "2"

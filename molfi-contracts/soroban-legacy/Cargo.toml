[workspace]
resolver = "2"
members = [
    "contracts/verifier",
    "contracts/privacy-pool",
    "contracts/market",
    "contracts/clob-settlement",
    "contracts/policy",
    "contracts/musdc",
    "contracts/vault",
    "contracts/predict-escrow",
    "contracts/mock-oracle",
    "contracts/confidential-bet",
    "integration-tests",
]

[workspace.dependencies]
soroban-sdk = "25"

# Size + safety oriented release profile (Soroban 64KB WASM limit).
[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.release-with-logs]
inherits = "release"
debug-assertions = true

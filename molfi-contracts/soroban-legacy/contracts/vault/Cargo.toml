[package]
name = "molfi-vault"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Molfi LP vault — deposit mUSDC, earn a share of trading fees"

[lib]
crate-type = ["lib", "cdylib"]

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }

[package]
name = "molfi-policy"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Compliance policy (ASP allow/deny + limits) for Molfi privacy pool"

[lib]
crate-type = ["lib", "cdylib"]

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }

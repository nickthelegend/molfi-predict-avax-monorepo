[package]
name = "molfi-verifier"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Groth16 (BLS12-381) zero-knowledge proof verifier for Molfi"

[lib]
crate-type = ["lib", "cdylib"]

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }

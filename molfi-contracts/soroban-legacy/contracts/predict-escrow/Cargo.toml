[package]
name = "molfi-predict-escrow"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Pari-mutuel binary betting with real mUSDC escrow, ZK-gated bets, and oracle resolution for Molfi"

[lib]
crate-type = ["lib", "cdylib"]

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }

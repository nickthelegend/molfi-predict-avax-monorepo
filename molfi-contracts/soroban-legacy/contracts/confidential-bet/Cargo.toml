[package]
name = "molfi-confidential-bet"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Confidential prediction-market betting — commitment notes + ZK claim (hidden side) for Molfi"

[lib]
crate-type = ["lib", "cdylib"]

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }

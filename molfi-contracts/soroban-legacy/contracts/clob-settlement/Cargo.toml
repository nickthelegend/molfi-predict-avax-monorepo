[package]
name = "molfi-clob-settlement"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "On-chain settlement of off-chain-matched CLOB orders for Molfi"

[lib]
crate-type = ["lib", "cdylib"]

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
